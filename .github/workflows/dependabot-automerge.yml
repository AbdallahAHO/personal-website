name: Dependabot auto-merge

# Squash-merges Dependabot's minor/patch group PRs once CI passes on them,
# then dispatches CI on main so the merge gets deployed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Merge minor/patch groups only
        run: |
          case "$BRANCH" in
            dependabot/*/minor-and-patch-*) ;;
            *) echo "Not an auto-merge group, leaving for review: $BRANCH"; exit 0 ;;
          esac
          gh pr merge "$BRANCH" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          gh workflow run ci.yml --ref main
