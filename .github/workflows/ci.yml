name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the Dependabot auto-merge workflow trigger the production deploy:
  # merges made with GITHUB_TOKEN don't fire `push`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint and format check
        run: pnpm lint:ci

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build tests
        run: pnpm test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-test-report
          path: playwright-report/
          retention-days: 7

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Preview deploy on PRs, production on main. Dependabot PRs can't read
  # Actions secrets, so they stop after verify.
  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      url: ${{ steps.url.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: pages deploy dist/ --project-name=personal-website --branch=${{ github.head_ref || github.ref_name }}

      - name: Resolve URL
        id: url
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "url=https://abdallahaho.com" >> "$GITHUB_OUTPUT"
          else
            echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Record GitHub deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_URL: ${{ steps.url.outputs.url }}
        with:
          script: |
            const isProduction = context.ref === 'refs/heads/main'
            const { data } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.sha,
              environment: isProduction ? 'production' : 'preview',
              auto_merge: false,
              required_contexts: [],
              transient_environment: !isProduction,
              production_environment: isProduction,
            })
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: data.id,
              state: 'success',
              environment_url: process.env.DEPLOY_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

  smoke:
    name: Smoke tests
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke tests against the deployed site
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.url }}
        run: pnpm test:smoke

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 7
