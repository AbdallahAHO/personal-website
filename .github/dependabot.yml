version: 2
updates:
  # Minor/patch land as one weekly PR that auto-merges when CI is green
  # (.github/workflows/dependabot-automerge.yml). Majors open on their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      astro-major:
        patterns: [astro, "@astrojs/*", astro-seo]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
